name: smartv

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package-test:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Install CastLabs Electron binary
        run: node node_modules/electron/install.js
      - name: Verify CastLabs Electron installation
        shell: pwsh
        run: |
          $electronDir = Join-Path $env:GITHUB_WORKSPACE 'node_modules/electron/dist'
          $electronExe = Join-Path $electronDir 'electron.exe'
          if (-not (Test-Path $electronExe)) {
            Write-Host "Expected Electron path not found: $electronDir"
            npm ls electron -w apps/desktop
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'node_modules') -Directory -Filter '*electron*' | Select-Object -ExpandProperty FullName
            throw "CastLabs Electron distribution is missing. Check Node version and package install output."
          }
          Write-Host "CastLabs Electron distribution verified: $electronExe"
      - name: Build Windows test installer
        env:
          SMARTV_BACKEND_URL: ${{ vars.SMARTV_BACKEND_URL || secrets.SMARTV_BACKEND_URL }}
          SMARTV_AGENT_TOKEN: ${{ secrets.SMARTV_AGENT_TOKEN }}
        run: npm run dist -w apps/desktop
      - name: Verify installer and Widevine payload
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/release'
          $exe = Get-ChildItem $releaseDir -Filter '*.exe' | Where-Object { $_.Name -notlike '*.blockmap' }
          if ($exe.Count -lt 1) {
            throw "No Windows installer was generated in $releaseDir"
          }
          $widevineDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/dist/WidevineCdm'
          if (-not (Test-Path $widevineDir)) {
            throw "Widevine payload was not generated at $widevineDir"
          }
          $widevineFiles = Get-ChildItem $widevineDir -Recurse -File
          if ($widevineFiles.Count -lt 1) {
            throw "Widevine payload directory is empty: $widevineDir"
          }
          Write-Host "Installer(s):"
          $exe | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Widevine files: $($widevineFiles.Count)"
      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: smartv-drm-test-installer
          path: |
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Install CastLabs Electron binary
        run: node node_modules/electron/install.js
      - name: Tag must match apps/desktop version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const t=process.env.TAG.replace(/^v/,'');const v=require('./apps/desktop/package.json').version;if(t!==v){console.error('tag '+process.env.TAG+' != desktop '+v);process.exit(1)}"
      - name: Build Windows installer
        env:
          SMARTV_BACKEND_URL: ${{ vars.SMARTV_BACKEND_URL || secrets.SMARTV_BACKEND_URL }}
          SMARTV_AGENT_TOKEN: ${{ secrets.SMARTV_AGENT_TOKEN }}
        run: npm run dist -w apps/desktop
      - name: Verify release assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/release'
          $exe = Get-ChildItem $releaseDir -Filter 'SmartTV-Setup-*.exe' | Where-Object { $_.Name -notlike '*.blockmap' }
          $yml = Join-Path $releaseDir 'latest.yml'
          $blockmap = Get-ChildItem $releaseDir -Filter 'SmartTV-Setup-*.exe.blockmap'
          if ($exe.Count -ne 1 -or -not (Test-Path $yml) -or $blockmap.Count -ne 1) {
            throw "Expected exactly one installer, latest.yml and one blockmap in $releaseDir"
          }
      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/SmartTV-Setup-*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/SmartTV-Setup-*.exe.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
