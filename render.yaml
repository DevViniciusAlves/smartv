# NOTE: if the Render service was created manually (not as a Blueprint from
# this file), the dashboard's Build Command / Start Command take precedence
# over this file. Keep both in sync:
#   Build: npm ci --omit=dev --omit=optional && npm run build -w packages/shared && npm run build -w apps/server
#   Start: npm run start -w apps/server
services:
  - type: web
    name: smartv-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --omit=dev --omit=optional && npm run build -w packages/shared && npm run build -w apps/server
    startCommand: npm run start -w apps/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGENT_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
