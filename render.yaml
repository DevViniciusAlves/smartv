services:
  - type: web
    name: smartv-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/server
    startCommand: npm run start -w apps/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROOM_TOKEN
        sync: false
      - key: AGENT_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
