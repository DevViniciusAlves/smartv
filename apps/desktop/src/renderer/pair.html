<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conexão — Smart TV</title>
  <link rel="stylesheet" href="./pair.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 14 4 9l5-5" />
      <path d="M20 20v-7a4 4 0 0 0-4-4H4" />
    </symbol>
  </svg>
  <div class="modal">
    <div class="sheet" role="dialog" aria-label="Conexão com o celular">
      <div class="mHead">
        <button id="connBack" class="round" aria-label="Voltar"><svg class="ic"><use href="#i-back"></use></svg></button>
        <b>Conexão</b>
        <span id="connPill" class="pill off">DESCONECTADO</span>
      </div>
      <div id="connSub" class="sub">Abra no celular para parear.</div>

      <div id="pairBlock">
        <div class="code-wrap">
          <div id="pairCode" class="code" aria-label="Código de pareamento">••••••</div>
          <button id="pairEye" class="eye" aria-label="Mostrar código" aria-pressed="false" title="Mostrar código">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <img id="pairQr" class="qr" alt="QR Code de pareamento" hidden />
        <div class="row between">
          <span id="pairCount" class="count">Gerando código…</span>
          <button id="pairNew">Gerar novo código</button>
        </div>
        <div id="pairPhones" class="sub"></div>
      </div>

      <details id="advBox" class="adv">
        <summary>Configuração avançada (servidor)</summary>
        <div id="remoteState" class="sub"></div>
        <label>Servidor (wss://…/ws)<input id="remoteBackend" type="text" placeholder="wss://seu-servico.onrender.com/ws" autocomplete="off" /></label>
        <label>Token do PC (AGENT_TOKEN)<input id="remoteToken" type="password" placeholder="vazio = manter salvo" autocomplete="off" /></label>
        <div class="row"><button id="remoteSave">Salvar e conectar</button></div>
      </details>

      <div class="row end"><button id="connClose">Fechar</button></div>
    </div>
  </div>
  <script type="module" src="./pair.ts"></script>
</body>
</html>
