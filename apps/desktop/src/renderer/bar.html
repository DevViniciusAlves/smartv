<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart TV</title>
  <link rel="stylesheet" href="./bar.css" />
</head>
<body>
  <div class="bar">
    <button id="home" aria-label="Voltar à Home">⌂ Início</button>
    <span id="title">Smart TV</span>
    <span id="status"></span>
    <span id="remoteStatus" class="remote" title="Estado do controle remoto"></span>
    <button id="remoteGear" aria-label="Configurar controle remoto">⚙ Controle</button>
  </div>
  <div id="remotePanel" class="remotePanel hidden">
    <div class="rpRow"><b>Controle pelo celular (/controle)</b></div>
    <div id="remoteState" class="rpState">Verificando…</div>
    <label>Servidor (wss://…/ws)<input id="remoteBackend" type="text" placeholder="wss://seu-servico.onrender.com/ws" autocomplete="off" /></label>
    <label>Token do PC (AGENT_TOKEN)<input id="remoteToken" type="password" placeholder="cole o AGENT_TOKEN (vazio = manter salvo)" autocomplete="off" /></label>
    <div class="rpRow">
      <button id="remoteSave">Salvar e conectar</button>
      <button id="remoteClose">Fechar</button>
    </div>
    <div class="rpHint">Use o MESMO AGENT_TOKEN do Render. Não rode o agente standalone junto (mesmo token derruba o outro). Diagnóstico no celular: /diag passo 5.</div>
  </div>
  <script type="module" src="./bar.ts"></script>
</body>
</html>
