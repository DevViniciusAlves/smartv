<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart TV</title>
  <link rel="stylesheet" href="./home.css" />
</head>
<body>
  <div class="safe">
    <header class="top">
      <div class="brand">Smart TV</div>
      <div class="clock"><span id="clock">--:--</span><span id="date"></span></div>
    </header>
    <main id="cards" class="cards" aria-label="Serviços"></main>
    <footer class="hint">
      <span id="status"></span>
      <div id="updateControls" class="hidden">
        <button id="btnCheck">Verificar atualização</button>
        <button id="btnDownload" class="hidden">Baixar atualização</button>
        <button id="btnRestart" class="hidden">Reiniciar e atualizar</button>
      </div>
      <button id="btnSelectMonitor">Escolher Monitor</button>
      <span>Use as setas e Enter • Esc volta aqui</span>
    </footer>
  </div>

  <div id="monitorModal" class="modal hidden">
    <div class="modal-content">
      <h2>Selecione o monitor</h2>
      <div id="monitorList"></div>
      <button id="btnMonitorOk">OK</button>
      <button id="btnCloseMonitor">Cancelar</button>
    </div>
  </div>
  <script type="module" src="./home.ts"></script>
</body>
</html>
