appId: com.smartv.app
productName: SmartTV
copyright: Copyright © 2026
# Must match the electron version in package.json (workaround for
# electron-builder not resolving the hoisted workspace install).
electronVersion: 44.5.1+wvcus
# electron-builder resolves electronDist relative to apps/desktop (the project
# directory), while npm workspaces hoist the CastLabs package to the repo root.
# Point to the actual installed CastLabs distribution instead of a non-existent
# apps/desktop/node_modules/electron/dist path.
electronDist: ../../node_modules/electron/dist
directories:
  output: release
asarUnpack:
  - dist/WidevineCdm/**
files:
  - dist/**
  - "!dist/**/*.d.ts*"
  - package.json
# Update source: GitHub Releases of this repo. electron-builder writes
# app-update.yml into the package and latest.yml + blockmaps next to the
# installer, which is what electron-updater reads. No tokens here: publishing
# uses the CI-provided GITHUB_TOKEN (see .github/workflows/ci.yml).
publish:
  provider: github
  owner: DevViniciusAlves
  repo: smartv
  # Tags are deliberate releases: publish immediately instead of draft.
  releaseType: release
win:
  # ONLY nsis. A second target (dir) makes electron-builder run two concurrent
  # publish flows for the same tag: the assets split across TWO duplicate
  # releases and `releases/latest/download/latest.yml` 404s (app shows "Falha
  # ao verificar atualização"). `--win nsis` on the CLI does NOT override this
  # list in electron-builder 26 — it must be a single target here.
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  # No spaces: latest.yml references this exact name for downloads.
  artifactName: SmartTV-Setup-${version}.${ext}
  createDesktopShortcut: true
  createStartMenuShortcut: true
