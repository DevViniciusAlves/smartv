appId: com.smartv.app
productName: SmartTV
copyright: Copyright © 2026
# Must match the electron version in package.json (workaround for
# electron-builder not resolving the hoisted workspace install).
electronVersion: 44.8.0
directories:
  output: release
files:
  - dist/**
  - "!dist/**/*.d.ts*"
  - package.json
# Update source: GitHub Releases of this repo. electron-builder writes
# app-update.yml into the package and latest.yml + blockmaps next to the
# installer, which is what electron-updater reads. No tokens here: publishing
# uses the CI-provided GITHUB_TOKEN (see .github/workflows/ci.yml).
publish:
  provider: github
  owner: DevViniciusAlves
  repo: smartv
win:
  target:
    - nsis
    - dir
nsis:
  oneClick: true
  perMachine: false
  # No spaces: latest.yml references this exact name for downloads.
  artifactName: SmartTV-Setup-${version}.${ext}
  createDesktopShortcut: true
  createStartMenuShortcut: true
