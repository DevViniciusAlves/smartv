<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <title>Controle TV</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/controle.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M12 3v8" />
      <path d="M6.6 6.2a8 8 0 1 0 10.8 0" />
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.07l-1.15 1.14" />
      <path d="M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.07l1.14-1.14" />
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20z" />
      <path d="M9.5 21.5V13h5v8.5" />
    </symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 5.5 20 18.5H4z" fill="currentColor" /></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 18.5 4 5.5h16z" fill="currentColor" /></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M5.5 12 18.5 4v16z" fill="currentColor" /></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M18.5 12 5.5 20V4z" fill="currentColor" /></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" /></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z" fill="currentColor" /></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 14 4 9l5-5" />
      <path d="M20 20v-7a4 4 0 0 0-4-4H4" />
    </symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3" />
      <path d="M16 3h3a2 2 0 0 1 2 2v3" />
      <path d="M21 16v3a2 2 0 0 1-2 2h-3" />
      <path d="M3 16v3a2 2 0 0 0 2 2h3" />
    </symbol>
    <symbol id="i-more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1.9" fill="currentColor" />
      <circle cx="12" cy="12" r="1.9" fill="currentColor" />
      <circle cx="19" cy="12" r="1.9" fill="currentColor" />
    </symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="2" y="6" width="20" height="12" rx="2.5" />
      <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
    </symbol>
    <symbol id="i-touch" viewBox="0 0 24 24">
      <path d="M5 3l6.5 18 2.3-7.2L21 11.5z" fill="currentColor" />
    </symbol>
    <symbol id="i-backspace" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 6H9.5L3 12l6.5 6H21a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 21 6z" />
      <path d="m17 9.5-5 5M12 9.5l5 5" />
    </symbol>
  </svg>

  <div id="app" class="remote">
    <div class="row top nav">
      <button id="btnPower" class="btn nav-btn danger" aria-label="Sair / desligar tela">SAIR</button>
      <button id="btnMore" class="btn nav-btn" aria-expanded="false" aria-label="Avançado">AVANÇADO</button>
      <button id="btnSearch" class="btn nav-btn" aria-label="Pesquisar">PESQUISAR</button>
      <button id="btnHome" class="btn nav-btn" aria-label="Início">INÍCIO</button>
    </div>
    <div class="statusWrap statusStrip">
      <div id="status" class="status st-yellow">Carregando…</div>
      <div id="substatus" class="sub"></div>
    </div>

    <div id="errorPanel" class="panel error hidden">
      <div id="errorText" class="errText"></div>
      <div class="row">
        <button id="btnRetry" class="btn">Tentar de novo</button>
        <a id="btnDiag" class="btn link" href="/diag">Verificar conexão</a>
      </div>
    </div>

    <div id="apps" class="row apps" aria-label="Serviços"></div>

    <div class="stage reference-stage">
      <div class="side-actions left-actions">
        <button class="btn utility" data-send='{"type":"volume","action":"mute"}' aria-label="Mudo">MUDO</button>
        <button class="btn utility" data-send='{"type":"key","key":"back"}' aria-label="Voltar">VOLTAR</button>
      </div>
      <div class="dial" role="group" aria-label="Direcional">
        <button class="btn dial-btn dup" data-hold="key:up" aria-label="Cima"><svg class="icon"><use href="#i-up"></use></svg></button>
        <button class="btn dial-btn dleft" data-hold="key:left" aria-label="Esquerda"><svg class="icon"><use href="#i-left"></use></svg></button>
        <button class="btn dial-btn dok" data-send='{"type":"key","key":"enter"}' aria-label="OK">OK</button>
        <button class="btn dial-btn dright" data-hold="key:right" aria-label="Direita"><svg class="icon"><use href="#i-right"></use></svg></button>
        <button class="btn dial-btn ddown" data-hold="key:down" aria-label="Baixo"><svg class="icon"><use href="#i-down"></use></svg></button>
      </div>
      <div class="side-actions right-actions">
        <button class="btn utility" data-send='{"type":"media","action":"fullscreen"}' aria-label="Tela cheia">TELA CHEIA</button>
        <button class="btn utility" data-send='{"type":"media","action":"pause"}' aria-label="Pausar"><svg class="icon"><use href="#i-pause"></use></svg> PAUSAR</button>
      </div>
    </div>
    <div class="volume-row">
      <button class="btn volume-btn" data-hold="volume:up" aria-label="Aumentar volume">+</button>
      <button class="btn volume-btn" data-hold="volume:down" aria-label="Diminuir volume">−</button>
    </div>

    <div id="morePanel" class="panel hidden">
      <div class="row">
        <button id="btnKeyboard" class="btn">
          <svg class="icon"><use href="#i-keyboard"></use></svg>Teclado
        </button>
        <button id="btnTouch" class="btn">
          <svg class="icon"><use href="#i-touch"></use></svg>Touch
        </button>
      </div>
      <p class="hint">Recursos avançados para quando o serviço exigir digitação ou mouse (ex.: login).</p>
    </div>

    <div id="keyboardPanel" class="panel hidden">
      <input id="kbdInput" type="text" placeholder="Digite e envie…" autocomplete="off" enterkeyhint="search" />
      <div class="row">
        <button id="kbdSend" class="btn">Enviar</button>
        <button id="kbdEnter" class="btn">Enter</button>
        <button id="kbdBack" class="btn" aria-label="Apagar">
          <svg class="icon"><use href="#i-backspace"></use></svg>
        </button>
      </div>
      <div class="row"><button id="kbdClose" class="btn">Voltar ao controle</button></div>
    </div>
    <div id="touchPanel" class="panel hidden">
      <div id="touchArea" class="touch">Arraste para mover • toque = clique • 2 dedos = botão direito/scroll</div>
      <div class="row"><button id="touchBack" class="btn">Voltar ao controle</button></div>
    </div>
    <div id="connModal" class="panel modal hidden" role="dialog" aria-label="Conexão com o SmarTV">
      <div class="mHead">
        <b>Conexão</b>
        <span id="connPill" class="status st-yellow">DESCONECTADO</span>
      </div>
      <div id="connMsg" class="errText"></div>
      <div class="row tabs">
        <button id="tabCode" class="btn tab active">Digitar código</button>
        <button id="tabScan" class="btn tab">Escanear QR</button>
      </div>
      <div id="paneCode">
        <p class="hint">Digite os 6 dígitos mostrados no PC em <b>Conexão</b>.</p>
        <div class="row">
          <input id="pairInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
            placeholder="000000" autocomplete="one-time-code" />
          <button id="pairGo" class="btn">Conectar</button>
        </div>
      </div>
      <div id="paneScan" class="hidden">
        <p class="hint">Aponte para o QR Code exibido no PC.</p>
        <video id="scanVideo" class="scan hidden" playsinline muted></video>
        <div class="row">
          <button id="scanStart" class="btn">Abrir câmera</button>
          <button id="scanStop" class="btn hidden">Fechar câmera</button>
        </div>
      </div>
      <div class="row between">
        <button id="connClose" class="btn">Fechar</button>
        <button id="connEnd" class="btn danger">Encerrar conexão</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/controle.ts"></script>
</body>
</html>
